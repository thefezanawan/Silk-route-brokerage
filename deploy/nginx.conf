# /etc/nginx/sites-available/silkroutebrokerage.com  (VPS deployment, Node app on 127.0.0.1:3000)
# 1) get the certificate first:  sudo certbot certonly --nginx -d silkroutebrokerage.com -d www.silkroutebrokerage.com
# 2) then enable this file and reload nginx.

# http -> https (both hostnames)
server {
    listen 80;
    listen [::]:80;
    server_name silkroutebrokerage.com www.silkroutebrokerage.com;
    return 301 https://www.silkroutebrokerage.com$request_uri;
}

# https apex -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name silkroutebrokerage.com;
    ssl_certificate     /etc/letsencrypt/live/silkroutebrokerage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkroutebrokerage.com/privkey.pem;
    return 301 https://www.silkroutebrokerage.com$request_uri;
}

# main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.silkroutebrokerage.com;
    ssl_certificate     /etc/letsencrypt/live/silkroutebrokerage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkroutebrokerage.com/privkey.pem;

    client_max_body_size 100k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
